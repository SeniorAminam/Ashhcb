services:
  ashhc-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ashhc-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ashhc_data:/app/data
      - ashhc_logs:/app/logs
    environment:
      - TZ=Asia/Tehran
    networks:
      - ashhc_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ashhc_network:
    name: ashhc_network
    driver: bridge

volumes:
  ashhc_data:
    name: ashhc_data
  ashhc_logs:
    name: ashhc_logs
